<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-order grid</title>
    <meta name="description"
    content="Animation of the Z-order curve, shown using a grid space, with some interaction." />
    <style>
html, body {
    height: 100%;
}

body {
    margin: 0;
    background: black;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}
    </style>
</head>
<body>
    <canvas></canvas>
    <script>
const canvas = document.querySelector(`canvas`);
canvas.width = innerWidth;
canvas.height = innerHeight;
const ctx = canvas.getContext(`2d`);

let boundingSquareSize;
function updateBoundingSquare() {
    boundingSquareSize = Math.min(canvas.width, canvas.height);
}
updateBoundingSquare();

let tx;
let ty;
function updateContainOffset() {
    tx = (canvas.width - boundingSquareSize) * 0.5;
    ty = (canvas.height - boundingSquareSize) * 0.5;
}
updateContainOffset();

const lineWidthRatio = 0.02;

let boundingLineWidth;
let boundingLineWidthOffset;
function updateBoundingLineWidth() {
    boundingLineWidth = boundingSquareSize * lineWidthRatio;
    boundingLineWidthOffset = boundingLineWidth * 0.5;
}
updateBoundingLineWidth();

const resize = new ResizeObserver(() => {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    updateBoundingSquare();
    updateContainOffset();
    updateBoundingLineWidth();
    rerender();
});

resize.observe(document.body);

const blueClr = `#0ff`;
const redClr = `#f00`;
let gridClr = localStorage.getItem(`gridClr`) ?? blueClr;

function drawSquare(squareIndex, level) {
    let col = 0;
    let row = 0;
    for (let b = 0; b < level; b++) {
        const stepOut = 2 * b;
        const bitX = (squareIndex >> stepOut) & 1;
        const bitY = (squareIndex >> (stepOut + 1)) & 1;
        col |= bitX << b;
        row |= bitY << b;
    }
    
    const squareSize = boundingSquareSize / (1 << level);
    const x = tx + col * squareSize;
    const y = ty + row * squareSize;

    ctx.strokeStyle = gridClr;
    ctx.lineWidth = squareSize * lineWidthRatio;
    ctx.strokeRect(
        x,
        y,
        squareSize,
        squareSize
    );
}

let squareCount = 0;
let level = 0;

function rerender() {
    for (let i = 0; i < squareCount; i++) drawSquare(i, level);
}

function clearGrid() {
    ctx.clearRect(
    tx - boundingLineWidthOffset,
    ty - boundingLineWidthOffset,
    boundingSquareSize + boundingLineWidth,
    boundingSquareSize + boundingLineWidth);
}

function addSquare() {
    squareCount++;

    const capacity = 1 << (2 * level);
    if (squareCount > capacity) {
        clearGrid();
        level++;
        rerender();
    } else {
        drawSquare(squareCount - 1, level);
    }
}

let gridSpeed;

if (localStorage.getItem(`gridSpeed`) !== null) {
    gridSpeed = Number(localStorage.getItem(`gridSpeed`));
} else {
    gridSpeed = 0;
    localStorage.setItem(`gridSpeed`, gridSpeed);
}

let id = setInterval(addSquare, gridSpeed);
let isRunning = true;

function resetGrid() {
    squareCount = 0;
    level = 0;
    clearGrid();
    rerender();
}

function slowDown() {
    gridSpeed += 10;
    localStorage.setItem(`gridSpeed`, gridSpeed);

    if (isRunning) {
        clearInterval(id);
        id = setInterval(addSquare, gridSpeed);
    }
}

function speedUp() {
    if (gridSpeed === 0) return;

    gridSpeed -= 10;
    localStorage.setItem(`gridSpeed`, gridSpeed);

    if (isRunning) {
        clearInterval(id);
        id = setInterval(addSquare, gridSpeed);
    }
}

document.addEventListener(`keydown`, e => {
    if (e.code === `Space`) {
        if (isRunning) {
            clearInterval(id);
            isRunning = false;
        } else {
            id = setInterval(addSquare, gridSpeed);
            isRunning = true;
        }
    }
    if (e.code === `KeyR`) {
        resetGrid();
    }
    if (e.code === `ArrowUp` || e.code === `ArrowDown`) {
        gridClr = gridClr === redClr ? blueClr : redClr;
        localStorage.setItem(`gridClr`, gridClr);
    }
    if (e.code === `ArrowLeft`) {
        slowDown();
    }
    if (e.code === `ArrowRight`) {
        speedUp();
    }
});
</script>
</body>
</html>
